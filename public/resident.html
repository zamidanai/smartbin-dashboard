<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Residents Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<style>
body{margin:0;background:#0f172a;color:white;font-family:system-ui;}
header{padding:15px;background:#0b1220;}
#map{height:60vh;}
button{padding:8px 12px;border-radius:8px;border:none;font-weight:bold;}
.card{padding:15px;background:#111827;margin:10px;border-radius:10px;}
</style>
</head>

<body>

<header>Residents Map View</header>

<div id="map"></div>

<div class="card">
<button onclick="toggleHeat()">Heatmap</button>
<button onclick="toggleCoverage()">150m Coverage</button>
</div>

<script>

const map=L.map('map').setView([26.3188612,50.2277122],15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let markers=[];
let heatLayer=null;
let coverageLayer=null;
let stations=[];

async function loadStations(){
  const res=await fetch('/api/v1/stations');
  const data=await res.json();
  stations=data.stations;

  markers.forEach(m=>map.removeLayer(m));
  markers=[];

  stations.forEach(s=>{
    const color=s.fillPct>=95?"red":s.fillPct>=80?"orange":"green";
    const marker=L.circleMarker([s.lat,s.lng],{
      radius:8,color:color,fillColor:color,fillOpacity:0.8
    }).addTo(map);

    marker.bindPopup(`<b>${s.name}</b><br>Fill: ${s.fillPct}%<br>
    <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}">
    Directions</a>`);

    markers.push(marker);
  });

  buildHeat();
  buildCoverage();
}

function buildHeat(){
  const pts=stations.map(s=>[s.lat,s.lng,Math.max(0.1,s.fillPct/100)]);
  heatLayer=L.heatLayer(pts,{radius:30});
}

function toggleHeat(){
  if(map.hasLayer(heatLayer)) map.removeLayer(heatLayer);
  else heatLayer.addTo(map);
}

function buildCoverage(){
  coverageLayer=L.layerGroup();
  stations.forEach(s=>{
    L.circle([s.lat,s.lng],{radius:150,color:"#22c55e",fillOpacity:0.05}).addTo(coverageLayer);
  });
}

function toggleCoverage(){
  if(map.hasLayer(coverageLayer)) map.removeLayer(coverageLayer);
  else coverageLayer.addTo(map);
}

setInterval(loadStations,5000);
loadStations();

</script>

</body>
</html>

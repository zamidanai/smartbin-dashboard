<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Authority Dashboard</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<style>
body{margin:0;background:#0b1220;color:white;font-family:system-ui;}
header{padding:15px;background:#070d18;display:flex;justify-content:space-between;}
button{padding:8px 12px;border-radius:8px;border:none;font-weight:bold;cursor:pointer;}
#map{height:60vh;}
.panel{padding:15px;}
.card{background:#111827;padding:12px;border-radius:10px;margin-bottom:10px;}
</style>
</head>

<body>

<header>
  <div>Authority Dashboard</div>
  <div>
    <button onclick="startSim()">Start Simulation</button>
    <button onclick="stopSim()">Stop Simulation</button>
  </div>
</header>

<div id="map"></div>

<div class="panel">
  <div class="card">
    <button onclick="toggleHeat()">Heatmap</button>
    <button onclick="toggleCoverage()">150m Coverage</button>
    <button onclick="optimizeRoute()">Optimize Route</button>
    <pre id="routeOutput"></pre>
  </div>
</div>

<script>

const map=L.map('map').setView([26.3188612,50.2277122],15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let markers=[];
let heatLayer=null;
let coverageLayer=null;
let stations=[];

async function loadStations(){
  const res=await fetch('/api/v1/stations');
  const data=await res.json();
  stations=data.stations;

  markers.forEach(m=>map.removeLayer(m));
  markers=[];

  stations.forEach(s=>{
    const color=s.fillPct>=95?"red":s.fillPct>=80?"orange":"green";
    const marker=L.circleMarker([s.lat,s.lng],{
      radius:8,
      color:color,
      fillColor:color,
      fillOpacity:0.8
    }).addTo(map);

    marker.bindPopup(`<b>${s.name}</b><br>Fill: ${s.fillPct}%<br>
    <button onclick="markEmptied('${s.id}')">Mark Emptied</button>`);

    markers.push(marker);
  });

  buildHeat();
  buildCoverage();
}

async function markEmptied(id){
  await fetch(`/api/v1/stations/${id}/mark-emptied`,{method:'POST'});
  loadStations();
}

function buildHeat(){
  const pts=stations.map(s=>[s.lat,s.lng,Math.max(0.1,s.fillPct/100)]);
  heatLayer=L.heatLayer(pts,{radius:30});
}

function toggleHeat(){
  if(map.hasLayer(heatLayer)) map.removeLayer(heatLayer);
  else heatLayer.addTo(map);
}

function buildCoverage(){
  coverageLayer=L.layerGroup();
  stations.forEach(s=>{
    L.circle([s.lat,s.lng],{radius:150,color:"#3b82f6",fillOpacity:0.05}).addTo(coverageLayer);
  });
}

function toggleCoverage(){
  if(map.hasLayer(coverageLayer)) map.removeLayer(coverageLayer);
  else coverageLayer.addTo(map);
}

function optimizeRoute(){
  const pickup=stations.filter(s=>s.fillPct>=80);
  pickup.sort((a,b)=>b.fillPct-a.fillPct);
  document.getElementById("routeOutput").textContent=
    pickup.map((s,i)=>`${i+1}. ${s.name} (${s.fillPct}%)`).join("\n");
}

async function startSim(){await fetch('/api/simulation/start',{method:'POST'});}
async function stopSim(){await fetch('/api/simulation/stop',{method:'POST'});}

setInterval(loadStations,5000);
loadStations();

</script>

</body>
</html>

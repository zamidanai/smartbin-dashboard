<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartBin Portal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      width: 90%;
      max-width: 500px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      opacity: 0.7;
      margin-bottom: 30px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      transition: 0.3s ease;
      cursor: pointer;
      border: 1px solid #334155;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #60a5fa;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .card h2 {
      margin-bottom: 10px;
    }

    .resident {
      border-left: 6px solid #22c55e;
    }

    .authority {
      border-left: 6px solid #60a5fa;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      opacity: 0.5;
    }

  </style>
</head>
<body>

  <div class="container">
    <h1>SmartBin System</h1>
    <p>Select your portal to continue</p>

    <a href="/resident-login.html" style="text-decoration:none;color:inherit;">
      <div class="card resident">
        <h2>Residents Portal</h2>
        <p>Find nearby stations, earn rewards, and report issues.</p>
      </div>
    </a>

    <a href="/authority-login.html" style="text-decoration:none;color:inherit;">
      <div class="card authority">
        <h2>Authorities Portal</h2>
        <p>Live monitoring, alerts, and analytics dashboard.</p>
      </div>
    </a>

    <div class="footer">
      SmartBin © 2025
    </div>
  </div>

</body>
</html>
